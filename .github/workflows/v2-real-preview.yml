name: V2 real bilingual preview publication (V2 CHANNELS ONLY)
on:
  workflow_dispatch:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths: ['.github/workflows/v2-real-preview.yml']
permissions:
  contents: read
concurrency:
  group: v2-real-preview-publication
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      V2_DISCORD_WEBHOOK_ENGLISH: ${{ secrets.V2_DISCORD_WEBHOOK_ENGLISH }}
      V2_DISCORD_WEBHOOK_ARABIC: ${{ secrets.V2_DISCORD_WEBHOOK_ARABIC }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/aggregateit-v2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded native rendering dependencies
        run: python -m pip install -r requirements.txt feedparser pillow reportlab beautifulsoup4 arabic-reshaper python-bidi
      - name: Capture real publishers and render bilingual held previews
        run: python -B v2_b46_live_editorial_runner.py --output v2-preview-receipt.json --four-products --visual-archive-dir v2-preview-pages
      - name: Validate all five pages then post exclusively to V2 preview webhooks
        run: python -B v2_preview_publish.py
      - name: Upload sanitized evidence for troubleshooting
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-real-preview-receipt
          path: v2-preview-receipt.json
          retention-days: 3
          if-no-files-found: warn
