name: TradingView Universe Refresh
on:
  schedule:
    - cron: "30 12 * * 1"
    - cron: "59 13-19 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests
      - uses: actions/cache@v5
        with:
          path: data
          key: data-${{ github.run_id }}-tv_refresh
          restore-keys: |
            data-
      - name: Universe (weekly Monday + manual)
        if: github.event.schedule == '30 12 * * 1' || github.event_name == 'workflow_dispatch'
        run: python tv.py --universe
      - name: Pulse (pre-briefing + post-close snapshots)
        run: python tv.py --pulse
      - name: Macro (indices, futures, forex, bonds)
        run: python tv.py --macro
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tv-data
          path: |
            data/tv_universe.json
            data/movers.json
            data/market_pulse.json
            data/macro_pulse.json
          if-no-files-found: warn
