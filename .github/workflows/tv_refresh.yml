name: TradingView Universe Refresh
on:
  schedule:
    - cron: "30 12 * * 1"
    - cron: "0 15,18 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: data
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-
      - name: Universe (weekly Monday)
        if: github.event.schedule == '30 12 * * 1' || github.event_name == 'workflow_dispatch'
        run: python tv.py --universe
      - name: Pulse (intraday snapshots)
        run: python tv.py --pulse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-data
          path: |
            data/tv_universe.json
            data/movers.json
            data/market_pulse.json
          if-no-files-found: warn
