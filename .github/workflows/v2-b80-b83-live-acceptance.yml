name: V2 B80-B83 real publisher editorial and shadow (NO POST)
on:
  workflow_dispatch:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-b80-b83-live-acceptance.yml'
      - 'v2_b49_single_slot_shadow.py'
      - 'v2_b46_live_editorial_runner.py'
      - 'v2_b94_daily_evidence.py'
      - 'tests/test_v2_b94_daily_evidence.py'
      - 'v2_b91_b93_audit.py'
      - 'tests/test_v2_b91_b93_audit.py'
      - 'v2_b88_b90_acceptance.py'
      - 'tests/test_v2_b88_b90_acceptance.py'
      - 'v2_b87_topic_bridge.py'
      - 'v2_b46_live_editorial.py'
      - 'v2_article_body_gate.py'
      - 'tests/test_v2_b87_arabic_topic.py'
      - 'v2_b86_visual_archive.py'
      - 'tests/test_v2_b86_visual_archive.py'
      - 'v2_sqlite_engine_bridge.py'
      - 'v2_sqlite_store.py'
      - 'tests/test_v2_sqlite_engine_bridge.py'
permissions:
  contents: read
concurrency:
  group: aggregateit-v2-b80-b83-live-acceptance
  cancel-in-progress: false
jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      LLM_API_KEY: ''
      LLM_FALLBACK_API_KEY: ''
      ARABIC_LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/aggregateit-v2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned project and rendering dependencies
        run: python -m pip install -r requirements.txt feedparser pillow reportlab beautifulsoup4 arabic-reshaper python-bidi
      - name: Test isolated engine SQLite bridge
        run: python -B -m unittest discover -s tests -p test_v2_sqlite_engine_bridge.py -v
      - name: Test Arabic topic acceptance regression
        run: python -B -m unittest discover -s tests -p test_v2_b87_arabic_topic.py -v
      - name: Test visual archive fail-closed contract
        run: python -B -m unittest discover -s tests -p test_v2_b86_visual_archive.py -v
      - name: Test B88-B90 acceptance synthesis
        run: python -B -m unittest discover -s tests -p test_v2_b88_b90_acceptance.py -v
      - name: Test B91-B93 evidence and release gates
        run: python -B -m unittest discover -s tests -p test_v2_b91_b93_audit.py -v
      - name: Test B94 bounded daily evidence ledger
        run: python -B -m unittest discover -s tests -p test_v2_b94_daily_evidence.py -v
      - name: B80/B81 original publisher article and editorial evidence
        run: python -B v2_b46_live_editorial_runner.py --output b80_b81_live_editorial.json --render-held --four-products --visual-archive-dir b86-visual-review
      - name: Persist bounded sanitized engine receipts in SQLite
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          from v2_sqlite_engine_bridge import save_receipt
          receipt=json.loads(Path('b80_b81_live_editorial.json').read_text())
          print(json.dumps(save_receipt(receipt,Path('v2-engine-evidence.sqlite'))))
          PY
      - name: B83 same-source-byte V1/V2 parser and held newsroom comparison
        run: |
          python -B - <<'PY'
          import json
          from pathlib import Path
          from v2_b49_single_slot_shadow import run_one_slot
          result=run_one_slot()
          Path('b83_same_slot_shadow.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf8')
          print(json.dumps({'status':result['status'],'rows':result.get('rows',[]),
            'failures':result.get('failures',{}),'can_release':False},ensure_ascii=False))
          PY
      - name: B88-B90 visual, coverage and full-parity gate synthesis
        run: |
          if test -f b86-visual-review/english-no-post-1.png && test -f b86-visual-review/arabic-no-post-1.png; then
            python -B v2_b88_b90_acceptance.py
            python -B v2_b91_b93_audit.py
            python -B v2_b94_daily_evidence.py
          else
            echo 'B88-B90 HOLD: genuine bilingual visual archive unavailable; no false acceptance'
          fi
      - name: Archive no-post real capture receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-b80-b83-real-acceptance
          path: |
            b80_b81_live_editorial.json
            b83_same_slot_shadow.json
            b88_b90_acceptance.json
            b91_b93_audit.json
            b94_daily_evidence.json
            b94-daily-evidence.sqlite
            v2-engine-evidence.sqlite
            b86-visual-review/*.png
          retention-days: 7
          if-no-files-found: warn
