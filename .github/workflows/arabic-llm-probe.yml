name: Arabic LLM Route Probe

on:
  push:
    branches: [main]
    paths:
      - .github/arabic-llm-probe-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARABIC_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ARABIC_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      ARABIC_LLM_MODEL: ${{ secrets.LLM_MODEL }}
      ARABIC_LLM_AUTH_HEADER: ${{ vars.LLM_AUTH_HEADER }}
      ARABIC_LLM_AUTH_SCHEME: ${{ vars.LLM_AUTH_SCHEME }}
      ARABIC_LLM_CHAT_PATH: ${{ vars.LLM_CHAT_PATH }}
      ARABIC_LLM_REQUEST_OPTIONS_JSON: ${{ vars.LLM_REQUEST_OPTIONS_JSON }}
      ARABIC_LLM_EXTRA_HEADERS_JSON: ${{ vars.LLM_EXTRA_HEADERS_JSON }}
      ARABIC_LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
      ARABIC_LLM_FALLBACK_BASE_URL: ${{ secrets.LLM_FALLBACK_BASE_URL }}
      ARABIC_LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
      ARABIC_LLM_FALLBACK_AUTH_HEADER: ${{ vars.LLM_FALLBACK_AUTH_HEADER }}
      ARABIC_LLM_FALLBACK_AUTH_SCHEME: ${{ vars.LLM_FALLBACK_AUTH_SCHEME }}
      ARABIC_LLM_FALLBACK_CHAT_PATH: ${{ vars.LLM_FALLBACK_CHAT_PATH }}
      ARABIC_LLM_FALLBACK_REQUEST_OPTIONS_JSON: ${{ vars.LLM_FALLBACK_REQUEST_OPTIONS_JSON }}
      ARABIC_LLM_FALLBACK_EXTRA_HEADERS_JSON: ${{ vars.LLM_FALLBACK_EXTRA_HEADERS_JSON }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install probe runtime
        run: python -m pip install requests feedparser pillow beautifulsoup4

      - name: Probe primary and fallback independently
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from arabic_live_v2 import probe_llms
          results=probe_llms()
          payload={
            "checked_at":datetime.now(timezone.utc).isoformat(),
            "all_ok":all(r.get("ok") for r in results),
            "routes":results
          }
          Path("arabic_newsletter/LLM_STATUS.json").write_text(
            json.dumps(payload,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print(json.dumps(payload,ensure_ascii=False))
          PY

      - name: Persist sanitized probe result
        run: |
          git config user.name "aggregateit-bot"
          git config user.email "aggregateit-bot@users.noreply.github.com"
          git add arabic_newsletter/LLM_STATUS.json
          git commit -m "Arabic LLM probe: update route health" || true
          git push origin HEAD:main

      - name: Require both LLM routes healthy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("arabic_newsletter/LLM_STATUS.json").read_text(encoding="utf-8"))
          assert p["all_ok"], p
          print("Both Arabic LLM routes are healthy")
          PY
