name: Promote Arabic Production

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Validated commit SHA from the Arabic branch"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: arabic-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify candidate belongs to Arabic branch
        run: |
          git fetch origin Arabic Arabic-production --no-tags
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/Arabic
          echo "Candidate is contained in Arabic branch: $CANDIDATE_SHA"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arabic_newsletter/requirements.txt

      - name: Install isolated Arabic validation runtime
        run: |
          python -m pip install -r arabic_newsletter/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libraqm0

      - name: Validate promoted candidate
        run: |
          python -m compileall -q arabic_newsletter arabic_layout
          python -m unittest arabic_newsletter.test_arabic -v
          python -m arabic_newsletter.run --sample --long --output arabic_newsletter/runtime/promotion-sample
          test -s arabic_newsletter/runtime/promotion-sample/arabic-p1.png
          test -s arabic_newsletter/runtime/promotion-sample/arabic-p2.png
          test -s arabic_newsletter/runtime/promotion-sample/arabic-p3.png

      - name: Promote exact validated SHA
        run: |
          git push origin "$CANDIDATE_SHA:refs/heads/Arabic-production"
          echo "Promoted Arabic-production to $CANDIDATE_SHA"
