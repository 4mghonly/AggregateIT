name: Arabic Source Audit

on:
  schedule:
    - cron: "15 1 * * *"
  push:
    branches: [main]
    paths:
      - .github/arabic-source-audit-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install audit runtime
        run: python -m pip install requests feedparser beautifulsoup4
      - name: Audit all configured sources
        run: python arabic_source_audit.py
      - name: Persist sanitized audit report
        run: |
          git config user.name "aggregateit-bot"
          git config user.email "aggregateit-bot@users.noreply.github.com"
          git add arabic_newsletter/SOURCE_AUDIT.json
          git commit -m "Arabic sources: update compatibility audit" || true
          git push origin HEAD:main

      - name: Validate target-region source floor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from arabic_newsletter.core import REGIONS
          audit=json.loads(Path("arabic_newsletter/SOURCE_AUDIT.json").read_text(encoding="utf-8"))
          counts={r:int((audit.get("regions",{}).get(r) or {}).get("compatible",0)) for r in REGIONS}
          weak={r:n for r,n in counts.items() if n<2}
          print("target-region compatible source counts:",counts)
          assert not weak, "target regions below two compatible sources: "+str(weak)
          PY

      - name: Rebuild production registry from audit
        run: python arabic_rebuild_sources.py

      - name: Persist rebuilt production registry
        run: |
          git config user.name "aggregateit-bot"
          git config user.email "aggregateit-bot@users.noreply.github.com"
          git add arabic_newsletter/sources.json
          git commit -m "Arabic sources: sync production registry to audit" || true
          git push origin HEAD:main
