name: AggregateIT V2 B49 exact-source partial shadow preflight NO POST

on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-b49-same-slot-shadow.yml'

permissions:
  contents: read

concurrency:
  group: aggregateit-v2-b49-partial-shadow
  cancel-in-progress: true

jobs:
  one-bilingual-exact-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      ARABIC_LLM_API_KEY: ''
      ARABIC_LLM_FALLBACK_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Focused B49 exact-source tests
        run: python -B -m unittest discover -s tests -p 'test_v2_b49_same_slot.py' -v
      - name: Final regression V2 and legacy
        run: |
          python -B -m unittest discover -s tests
          python -B tests.py
          python -B -m unittest arabic_newsletter.test_arabic
      - name: Genuine single-capture feed-to-legacy parsers and V2 held editorial
        run: python -B v2_b49_shadow_runner.py --output reports/b49/sanitized.json
      - name: Archive hashes and status only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-b49-partial-shadow-metrics
          path: reports/b49/sanitized.json
          retention-days: 3
          if-no-files-found: warn
