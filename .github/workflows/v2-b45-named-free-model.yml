name: AggregateIT V2 B45 THIRD distinct explicitly-free model benchmark NO POST
on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths: ['.github/workflows/v2-b45-named-free-model.yml']
permissions:
  contents: read
jobs:
  named-free-model-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      ARABIC_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ARABIC_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      ARABIC_LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Isolated read-only model dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi
      - name: Named FREE model offline safety checks
        run: python -B -m unittest discover -s tests -p test_v2_b45_named_free_candidate.py -v
      - name: Two capped actual FREE named-model calls with original synthetic EN and SO
        run: python -B v2_b45_named_free_candidate.py --output reports/b45-named/status.json
      - name: Preserve only sanitized free endpoint diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-b45-named-free-translation
          path: reports/b45-named/status.json
          retention-days: 3
          if-no-files-found: warn
