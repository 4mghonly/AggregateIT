name: AggregateIT V2 B40 live/parser and synthetic native shadow (no post)

on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-b40-stage-shadow.yml'

permissions:
  contents: read

concurrency:
  group: aggregateit-v2-b40-no-post
  cancel-in-progress: true

jobs:
  isolated-b40:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi
      - name: Run new B40 fail-closed stage tests
        run: python -B -m unittest discover -s tests -p test_v2_b40_stage_acceptance.py -v
      - name: Entire isolated V2 suite
        run: python -B -m unittest discover -s tests
      - name: V1 English legacy regression
        run: python -B tests.py
      - name: V1 Arabic legacy regression
        run: python -B -m unittest arabic_newsletter.test_arabic
      - name: Real source parser receipts and separately synthetic native/packet exercise
        run: python -B v2_b40_private_chain.py --output reports/b40/stage-receipts.json
      - name: Upload sanitized receipts only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-b40-no-post-stage-receipts
          path: reports/b40/stage-receipts.json
          retention-days: 2
          if-no-files-found: warn
