name: AggregateIT V2 B55 bounded OpenRouter paid evaluation NO POST
on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths: ['.github/workflows/v2-b55-paid-models.yml']
permissions:
  contents: read
concurrency:
  group: aggregateit-v2-b55-model-eval
  cancel-in-progress: true
jobs:
  capped-models:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Focused TDD and hard budget invariants
        run: python -B -m unittest discover -s tests -p 'test_v2_b55_budgeted_models.py' -v
      - name: Complete V2 and English/Arabic legacy regression
        run: |
          python -B -m unittest discover -s tests
          python -B tests.py
          python -B -m unittest arabic_newsletter.test_arabic
      - name: At most 6 bounded paid-model requests, never publisher texts
        run: python -B v2_b55_budgeted_models.py --output reports/b55/metadata.json
      - name: Archive sanitized spend and model statuses only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-b55-paid-language-evaluation
          path: reports/b55/metadata.json
          retention-days: 3
          if-no-files-found: warn
