name: News Intelligence Engine
on:
  schedule:
    - cron: "7 * * * *"        # avoid top-of-hour Actions congestion
  push:
    branches: [main]
    paths:
      - .github/engine-trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: Collect and score without storing
        type: boolean
        default: true
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests feedparser trafilatura matplotlib
      - name: Offline regression gate
        env:
          QWEN_API_KEY: ""
          QWEN_FALLBACK_API_KEY: ""
        run: |
          python -m py_compile *.py
          python tests.py
          rm -rf data reports __pycache__
      - name: Restore data cache
        uses: actions/cache@v5
        with:
          path: data/
          key: data-${{ github.run_id }}-engine
          restore-keys: |
            data-
      - name: Restore reports cache
        uses: actions/cache@v5
        with:
          path: reports/
          key: reports-${{ github.run_id }}-engine
          restore-keys: |
            reports-
      - name: Run collection engine without legacy Discord digest delivery
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          ENGINE_DELIVERY: "false"
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_FALLBACK_API_KEY: ${{ secrets.ARABIC_LLM_API_KEY }}
          QWEN_FALLBACK_BASE_URL: ${{ secrets.ARABIC_LLM_BASE_URL }}
          QWEN_MODEL: qwen3.8-omni-flash
          QWEN_MAX_CALLS: "10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOCIAL_PROXY_URL: ${{ secrets.SOCIAL_PROXY_URL }}
          SOCIAL_BUDGET_S: "180"
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL || vars.RSSHUB_BASE_URL }}
          RSS_BRIDGE_URL: ${{ secrets.RSS_BRIDGE_URL || vars.RSS_BRIDGE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python main.py
      - name: Upload engine health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: intel-report
          path: reports/
          overwrite: true
          if-no-files-found: warn
