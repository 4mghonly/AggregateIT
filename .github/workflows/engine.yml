name: News Intelligence Engine
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install feedparser aiohttp requests trafilatura
      - uses: actions/cache@v4
        with:
          path: data
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-
      - name: Run python main.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOCIAL_PROXY_URL: ${{ secrets.SOCIAL_PROXY_URL }}
        run: python main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-report
          path: reports/
