name: Repository Health
on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'config/**'
      - '.github/workflows/**'
      - 'requirements.txt'
      - 'README.md'
      - 'PROJECT.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-health-main
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pillow pyyaml
      - name: Compile Python
        run: python -m py_compile *.py
      - name: Run core regression suite
        env:
          LLM_API_KEY: ""
          LLM_FALLBACK_API_KEY: ""
        run: python tests.py
      - name: Run Gazette layout tests
        run: python -m unittest -v test_gazette_layout
      - name: Validate YAML, JSON and configuration uniqueness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('.github/workflows').glob('*.yml'):
              with path.open(encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('yaml ok', path)
          for path in Path('config').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('json ok', path)
          sources=json.loads(Path('config/sources.json').read_text(encoding='utf-8'))
          urls=[(row.get('Url') or '').replace('http://','https://').rstrip('/').lower() for row in sources]
          urls=[x for x in urls if x]
          assert len(urls)==len(set(urls)), 'duplicate canonical source URL'
          tickers=json.loads(Path('config/tickers.json').read_text(encoding='utf-8'))
          syms=[row.get('t') for row in tickers if row.get('t')]
          assert len(syms)==len(set(syms)), 'duplicate ticker symbol'
          assert Path('README.md').exists()
          assert not Path('README. md').exists()
          scheduler=Path('.github/workflows/arabic-scheduler.yml').read_text(encoding='utf-8')
          assert all(cron in scheduler for cron in ('0 2 * * *','0 8 * * *','0 14 * * *','0 20 * * *')), 'Arabic UAE six-hour schedule changed'
          assert '.github/arabic-v2-trigger' in scheduler, 'Arabic V2 trigger missing'
          assert 'timeout-minutes: 20' in scheduler, 'Arabic V2 runtime envelope changed'
          assert 'python arabic_live_v2.py' in scheduler, 'Arabic V2 engine missing from production scheduler'
          assert 'arabic_newsletter.run --send' not in scheduler, 'retired Arabic V1 production path reintroduced'
          assert 'ARABIC_DISCORD_MAX_FILE_BYTES: "19000000"' in scheduler, 'Discord upload safety contract changed'
          slide=Path('.github/workflows/slide.yml').read_text(encoding='utf-8')
          assert '30 11 * * *' in slide, 'Gazette 15:30 UAE schedule changed'
          PY
      - name: Check conflict markers and obvious committed secrets
        run: |
          ! grep -RInE '^(<<<<<<<|>>>>>>>)( |$)' --exclude-dir=.git .
          ! grep -RInE 'https://(discord|discordapp)\.com/api(/v[0-9]+)?/webhooks/[0-9]+/[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
          ! grep -RInE '(sk-|qwen-|dashscope-)[A-Za-z0-9_-]{24,}' --exclude-dir=.git .
