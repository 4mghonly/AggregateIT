name: AggregateIT V2 B46 real article editorial chain (no post)
# Capture sanitized held reasons for genuine-data diagnosis.

on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-b46-real-evidence.yml'

permissions:
  contents: read

concurrency:
  group: aggregateit-v2-b46-real-evidence
  cancel-in-progress: true

jobs:
  read-only-b46:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      ARABIC_LLM_API_KEY: ''
      ARABIC_LLM_FALLBACK_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Focused B46 article bridge tests
        run: python -B -m unittest discover -s tests -p test_v2_b46_live_editorial.py -v
      - name: Complete V2 regression
        run: python -B -m unittest discover -s tests
      - name: English legacy regression
        run: python -B tests.py
      - name: Arabic legacy regression
        run: python -B -m unittest arabic_newsletter.test_arabic
      - name: Bounded real feed and publisher-article evidence integration
        run: python -B v2_b46_live_editorial_runner.py --output reports/b46/metrics.json
      - name: Retain metrics, never article text or screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-b46-article-editorial-metrics-only
          path: reports/b46/metrics.json
          retention-days: 3
          if-no-files-found: warn
