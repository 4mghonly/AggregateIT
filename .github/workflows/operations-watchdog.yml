name: Production Cadence Watchdog
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: aggregateit-cadence-watchdog
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python operations_watchdog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: production-cadence-health
          path: reports/operations_health.json
