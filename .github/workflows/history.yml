name: Event History Search
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker filter (e.g. NVDA)"
        required: false
        type: string
      query:
        description: "Free-text search"
        required: false
        type: string
      hours:
        description: "Lookback hours"
        required: false
        type: string
        default: "168"
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests
      - uses: actions/cache@v5
        with:
          path: data
          key: data-${{ github.run_id }}-history
          restore-keys: |
            data-
      - name: Search
        env:
          INPUT_HOURS: ${{ github.event.inputs.hours }}
          INPUT_TICKER: ${{ github.event.inputs.ticker }}
          INPUT_QUERY: ${{ github.event.inputs.query }}
        run: |
          args=(--hours "$INPUT_HOURS")
          [ -n "$INPUT_TICKER" ] && args+=(--ticker "$INPUT_TICKER")
          [ -n "$INPUT_QUERY" ] && args+=(--query "$INPUT_QUERY")
          python history.py "${args[@]}"
