name: LLM Ping
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - llm.py
      - llm_ping.py
      - .github/workflows/llm_ping.yml
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests
      - name: Ping endpoints
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: qwen3.8-flash
        run: python llm_ping.py
