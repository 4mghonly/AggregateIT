name: Gazette Offline QA
on:
  push:
    branches: [gazette-readability-recovery]
  pull_request:
    paths:
      - gazette_render.py
      - test_gazette_layout.py
      - slide.py
      - .github/workflows/gazette-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install matplotlib requests pillow
      - name: Syntax and offline regression tests
        run: |
          python -m py_compile gazette_render.py slide.py test_gazette_layout.py
          python -m unittest -v test_gazette_layout
      - name: Upload clearly labelled synthetic samples
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gazette-offline-samples
          path: qa-samples/
          if-no-files-found: warn
          retention-days: 7
