name: Arabic V2 CI

on:
  push:
    branches: [main]
    paths:
      - arabic_live_v2.py
      - arabic_newsletter/sources.json
      - arabic_newsletter/brief_schema.py
      - arabic_newsletter/render.py
      - arabic_newsletter/delivery.py
      - arabic_layout/**
      - .github/workflows/arabic-ci.yml
      - .github/workflows/arabic-scheduler.yml
  pull_request:
    branches: [main]
    paths:
      - arabic_live_v2.py
      - arabic_newsletter/sources.json
      - arabic_newsletter/brief_schema.py
      - arabic_newsletter/render.py
      - arabic_newsletter/delivery.py
      - arabic_layout/**
      - .github/workflows/arabic-ci.yml
      - .github/workflows/arabic-scheduler.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-v2-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal V2 validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests feedparser beautifulsoup4

      - name: Validate V2 engine and renderer
        run: |
          python -m py_compile arabic_live_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          import arabic_live_v2 as v2
          from arabic_newsletter.sample import fixture
          from arabic_newsletter.render import render

          rows=json.loads(Path("arabic_newsletter/sources.json").read_text(encoding="utf-8"))
          assert isinstance(rows,list) and rows
          from arabic_newsletter.core import REGIONS
          active=[r for r in rows if r.get("enabled") and r.get("verification_status")=="active"]
          counts={region:sum(1 for r in active if r.get("region")==region) for region in REGIONS}
          assert all(n>=2 for n in counts.values()), counts
          assert all((r.get("feed") or "").startswith("http") or r.get("adapter")=="html_headlines" for r in active), "active source missing supported adapter"
          assert callable(v2.collect)
          assert callable(v2.make_event)

          from arabic_newsletter.brief_schema import build_brief, validate_brief, dumps
          event={
            "region":"iraq","topic":"security",
            "title_ar":"اختبار بنية النشرة",
            "summary_ar":"بحسب مصدر الاختبار، اختبار بنية النشرة.",
            "severity":"medium","status_ar":"تقرير منسوب",
            "fingerprint":"ci-v3",
            "sources":[{
              "id":"ci-source","source_id":"ci-source","source":"مصدر اختبار",
              "url":"https://example.com/ci","published":0,"affiliation":"synthetic",
              "kind":"news","country":"IQ","language":"ar","region":"iraq"
            }]
          }
          canonical=build_brief([event],[],1)
          assert not validate_brief(canonical), validate_brief(canonical)
          assert '"schema_version": "arabic-brief-v3"' in dumps(canonical)

          sample=fixture(long=True)
          out=Path("arabic_newsletter/runtime/v2-ci")
          paths,_=render(sample,out)
          assert len(paths)==3
          assert all(p.is_file() and p.stat().st_size>0 for p in paths)
          print("Arabic V2 CI passed")
          PY

      - name: Upload V2 CI render
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: arabic-v2-ci-${{ github.run_id }}
          path: arabic_newsletter/runtime/v2-ci/
          retention-days: 7
          if-no-files-found: warn
