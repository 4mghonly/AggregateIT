name: Arabic V2 CI

on:
  push:
    branches: [main]
    paths:
      - arabic_live_v2.py
      - arabic_newsletter/sources.json
      - arabic_newsletter/render.py
      - arabic_newsletter/delivery.py
      - arabic_layout/**
      - .github/workflows/arabic-ci.yml
      - .github/workflows/arabic-scheduler.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-v2-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal V2 validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests feedparser beautifulsoup4

      - name: Validate V2 engine and renderer
        run: |
          python -m py_compile arabic_live_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          import arabic_live_v2 as v2
          from arabic_newsletter.sample import fixture
          from arabic_newsletter.render import render

          rows=json.loads(Path("arabic_newsletter/sources.json").read_text(encoding="utf-8"))
          assert isinstance(rows,list) and rows
          assert callable(v2.collect)
          assert callable(v2.build_brief)
          assert callable(v2.make_event)

          sample=fixture(long=True)
          out=Path("arabic_newsletter/runtime/v2-ci")
          paths,_=render(sample,out)
          assert len(paths)==3
          assert all(p.is_file() and p.stat().st_size>0 for p in paths)
          print("Arabic V2 CI passed")
          PY

      - name: Upload V2 CI render
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: arabic-v2-ci-${{ github.run_id }}
          path: arabic_newsletter/runtime/v2-ci/
          retention-days: 7
          if-no-files-found: warn
