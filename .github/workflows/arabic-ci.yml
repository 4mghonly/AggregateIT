name: Arabic Production CI

on:
  push:
    branches: [main]
    paths:
      - arabic_newsletter/**
      - arabic_layout/**
      - .github/workflows/arabic-ci.yml
      - .github/workflows/arabic-scheduler.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-ci-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arabic_newsletter/requirements.txt
      - name: Install Arabic validation runtime
        run: |
          python -m pip install -r arabic_newsletter/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libraqm0
      - name: Compile and validate
        env:
          ARABIC_LLM_API_KEY: ""
          ARABIC_LLM_FALLBACK_API_KEY: ""
        run: |
          python -m compileall -q arabic_newsletter arabic_layout
          python -m unittest arabic_newsletter.test_arabic -v
          python -m arabic_newsletter.run --sample --long --output arabic_newsletter/runtime/ci-sample
          test -s arabic_newsletter/runtime/ci-sample/arabic-p1.png
          test -s arabic_newsletter/runtime/ci-sample/arabic-p2.png
          test -s arabic_newsletter/runtime/ci-sample/arabic-p3.png
      - name: Upload validation render
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arabic-ci-sample-${{ github.run_id }}
          path: arabic_newsletter/runtime/ci-sample/
          retention-days: 7
          if-no-files-found: warn
