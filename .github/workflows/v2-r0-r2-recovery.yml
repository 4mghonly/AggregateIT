name: V2 R0-R2 recovery acceptance
on:
  push:
    branches: [audit/b119-evidence-reconciliation]
    paths:
      - 'v2_b46_live_editorial.py'
      - 'v2_b46_live_editorial_runner.py'
      - 'v2_editorial.py'
      - 'v2_product_compiler.py'
      - 'tests/test_v2_r1_editorial_capacity.py'
      - 'tests/test_v2_r2_analysis_contract.py'
      - 'tests/test_v2_r1_runner_capacity.py'
      - 'tests/test_v2_r2_live_analysis_wiring.py'
      - 'tests/test_v2_r2_provider_failure_diagnostics.py'
      - 'tests/test_v2_r2_metrics_truth.py'
      - 'tests/test_v2_r7_history_contract.py'
      - 'tests/test_v2_r7_observation_days.py'
      - 'v2_weekly_rollup.py'
      - 'v2_r2_model_adapter.py'
      - 'tests/test_v2_r2_model_adapter.py'
      - 'v2_r2_http_transport.py'
      - 'v2_r2_secret_model_probe.py'
      - 'v2_r2_real_publisher_acceptance.py'
      - 'tests/test_v2_r2_http_transport.py'
      - 'tests/test_v2_r2_runner_wiring.py'
      - 'tests/test_v2_r2_end_to_end_model_acceptance.py'
      - 'v2_b47_four_product_held.py'
      - '.github/workflows/v2-r0-r2-recovery.yml'
  workflow_dispatch:
    inputs:
      acceptance_gate:
        description: 'Which R2 acceptance gate to execute'
        required: false
        default: 'publisher'
        type: choice
        options: [publisher, fixture]
permissions:
  contents: read
jobs:
  editorial-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R1 regression contract
        run: python -m unittest discover -s tests -p 'test_v2_r1_editorial_capacity.py' -v
      - name: R1 live-runner propagation regression
        run: python -m unittest discover -s tests -p 'test_v2_r1_runner_capacity.py' -v
      - name: R2 evidence-bound analysis regression
        run: python -m unittest discover -s tests -p 'test_v2_r2_analysis_contract.py' -v
      - name: R2 live provider integration regression
        run: python -m unittest discover -s tests -p 'test_v2_r2_live_analysis_wiring.py' -v
      - name: R2 provider diagnostics regression
        run: python -m unittest discover -s tests -p 'test_v2_r2_provider_failure_diagnostics.py' -v
      - name: R2 metrics truthfulness regression
        run: python -m unittest discover -s tests -p 'test_v2_r2_metrics_truth.py' -v
      - name: R7 source-bound history regression
        run: python -m unittest discover -s tests -p 'test_v2_r7_history_contract.py' -v
      - name: R7 observation-day evidence regression
        run: python -m unittest discover -s tests -p 'test_v2_r7_observation_days.py' -v
      - name: R2 provider-neutral model adapter regression
        run: python -m unittest discover -s tests -p 'test_v2_r2_model_adapter.py' -v
      - name: R2 HTTPS transport regression
        run: python -m unittest discover -s tests -p 'test_v2_r2_http_transport.py' -v
      - name: R2 runner integration regression
        run: python -m unittest discover -s tests -p 'test_v2_r2_runner_wiring.py' -v
      - name: R2 model-response-to-edition acceptance (offline)
        run: python -m unittest discover -s tests -p 'test_v2_r2_end_to_end_model_acceptance.py' -v
      - name: One-call real V2 model secret acceptance (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance_gate == 'fixture'
        env:
          V2_LLM_API_KEY: ${{ secrets.V2_LLM_API_KEY }}
          V2_LLM_BASE_URL: ${{ secrets.V2_LLM_BASE_URL }}
          V2_LLM_MODEL: ${{ secrets.V2_LLM_MODEL }}
        run: |
          python -m pip install requests
          python v2_r2_secret_model_probe.py
      - name: Requested bilingual model evaluation and Telegram report (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          V2_LLM_API_KEY: ${{ secrets.V2_LLM_API_KEY }}
          V2_LLM_BASE_URL: ${{ secrets.V2_LLM_BASE_URL }}
          V2_LLM_MODEL: ${{ secrets.V2_LLM_MODEL }}
          V2_LLM_FALLBACK_API_KEY: ${{ secrets.V2_LLM_FALLBACK_API_KEY }}
          V2_LLM_FALLBACK_BASE_URL: ${{ secrets.V2_LLM_FALLBACK_BASE_URL }}
          V2_LLM_FALLBACK_MODEL: ${{ secrets.V2_LLM_FALLBACK_MODEL }}
          V2_TELEGRAM_BOT_TOKEN: ${{ secrets.V2_TELEGRAM_BOT_TOKEN }}
          V2_TELEGRAM_CHAT_ID_ENGLISH: ${{ secrets.V2_TELEGRAM_CHAT_ID_ENGLISH }}
          V2_TELEGRAM_CHAT_ID_ARABIC: ${{ secrets.V2_TELEGRAM_CHAT_ID_ARABIC }}
        run: python v2_r2_telegram_evaluation.py
      - name: Real publisher bilingual R2 model acceptance (manual only)
        if: github.event_name == 'workflow_dispatch'
        env:
          V2_LLM_API_KEY: ${{ secrets.V2_LLM_API_KEY }}
          V2_LLM_BASE_URL: ${{ secrets.V2_LLM_BASE_URL }}
          V2_LLM_MODEL: ${{ secrets.V2_LLM_MODEL }}
          V2_LLM_FALLBACK_API_KEY: ${{ secrets.V2_LLM_FALLBACK_API_KEY }}
          V2_LLM_FALLBACK_BASE_URL: ${{ secrets.V2_LLM_FALLBACK_BASE_URL }}
          V2_LLM_FALLBACK_MODEL: ${{ secrets.V2_LLM_FALLBACK_MODEL }}
        run: |
          python -m pip install -r requirements.txt beautifulsoup4 feedparser
          python v2_r2_real_publisher_acceptance.py
      - name: Syntax check affected modules
        run: python -m py_compile v2_b46_live_editorial_runner.py v2_b46_live_editorial.py v2_editorial.py v2_product_compiler.py
