name: AggregateIT V2 B56 independent family under cumulative 50c limit
on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths: ['.github/workflows/v2-b56-second-provider.yml']
permissions:
  contents: read
concurrency:
  group: aggregateit-v2-b56-independent
  cancel-in-progress: true
jobs:
  isolated-models:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Focused cumulative budget and structured-output tests
        run: python -B -m unittest discover -s tests -p test_v2_b56_second_provider.py -v
      - name: Full V2 and both legacy suites
        run: |
          python -B -m unittest discover -s tests
          python -B tests.py
          python -B -m unittest arabic_newsletter.test_arabic
      - name: At most four synthetic-model requests with B55 reservation counted
        run: python -B v2_b56_second_provider.py --output reports/b56/metadata.json
      - name: Sanitize and archive budgets and statuses only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-b56-independent-family-status
          path: reports/b56/metadata.json
          retention-days: 3
          if-no-files-found: warn
