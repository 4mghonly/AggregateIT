name: AggregateIT V2 B46 market and Naysayer observation (no post)

on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-b46-market-critic.yml'

permissions:
  contents: read

concurrency:
  group: aggregateit-v2-b46-market-critic
  cancel-in-progress: true

jobs:
  market-held-no-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      ARABIC_LLM_API_KEY: ''
      ARABIC_LLM_FALLBACK_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Focused B46 market and critic tests
        run: python -B -m unittest discover -s tests -p 'test_v2_b46_*.py' -v
      - name: Full V2 suite closure
        run: python -B -m unittest discover -s tests
      - name: Legacy English
        run: python -B tests.py
      - name: Legacy Arabic
        run: python -B -m unittest arabic_newsletter.test_arabic
      - name: One attempt live scanner, hold unverified numbers, check critic abstention
        run: python -B v2_b46_market_critic_runner.py --output reports/b46-market/report.json
      - name: Upload count/status metadata only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-b46-market-naysayer-held
          path: reports/b46-market/report.json
          retention-days: 3
          if-no-files-found: warn
