name: Intelligence Briefings
on:
  schedule:
    - cron: "0 4 * * *"         # MINI (08:00 GST)
    - cron: "0 14 * * 1-5"      # MORNING (18:40 GST)
    - cron: "0 21 * * 1-5"      # CLOSING (01:00 GST)
  workflow_dispatch:
    inputs:
      mode:
        description: "Briefing Type"
        type: choice
        default: "MORNING"
        options: ["MINI", "MORNING", "CLOSING"]
name: News Intelligence Engine

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: aggregateit-writers
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    ...
jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: data
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-
      - name: Fresh pulse immediately before briefing
        if: github.event.inputs.mode != 'MINI'
        run: python tv.py --pulse --macro
      - name: Send Discord Briefing
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BRIEFING_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 4 * * *' && 'MINI' || (github.event.schedule == '0 21 * * 1-5' && 'CLOSING' || 'MORNING')) }}
        run: python briefing.py
