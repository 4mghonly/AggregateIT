name: Intelligence Briefings
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 14-20 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Briefing Type"
        type: choice
        default: "LIVE"
        options: ["MINI", "LIVE", "MORNING", "CLOSING"]
jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: data
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-
      - name: Fresh pulse immediately before briefing (safety net vs cron drift)
        if: github.event.schedule != '0 4 * * *' && github.event.inputs.mode != 'MINI'
        run: python tv.py --pulse
      - name: Send Discord Briefing
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BRIEFING_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '0 4 * * *' && 'MINI' || (github.event.schedule == '0 21 * * 1-5' && 'CLOSING' || 'LIVE')) }}
        run: python briefing.py
