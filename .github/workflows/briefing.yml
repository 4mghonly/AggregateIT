name: Daily Intelligence Briefing
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests feedparser trafilatura matplotlib
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: data-${{ github.run_id }}-briefing
          restore-keys: |
            data-
      - name: Restore reports cache
        uses: actions/cache@v4
        with:
          path: reports/
          key: reports-${{ github.run_id }}-briefing
          restore-keys: |
            reports-
      - name: Run briefing
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          QWEN_MAX_CALLS: "10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python briefing.py
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-report
          path: reports/
          overwrite: true
          if-no-files-found: warn
      - name: Restore reports cache
        uses: actions/cache@v4
        with:
          path: reports/
          key: reports-${{ github.run_id }}-briefing
          restore-keys: |
            reports-

      - name: Run briefing
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          QWEN_MAX_CALLS: "10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python briefing.py

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-report
          path: reports/
          if-no-files-found: warn
