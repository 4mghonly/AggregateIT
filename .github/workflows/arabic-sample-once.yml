name: One-shot Arabic layout sample
on:
  push:
    branches: [Arabic]
    paths:
      - .github/arabic-sample-trigger
permissions:
  contents: read
concurrency:
  group: arabic-sample-once
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_ARABIC: \${{ secrets.DISCORD_WEBHOOK_ARABIC }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arabic_newsletter/requirements.txt
      - name: Install isolated dependencies and Arabic fonts
        run: |
          python -m pip install -r arabic_newsletter/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libraqm0
      - name: Render approved Arabic layout sample
        run: python -m arabic_newsletter.run --sample --output arabic_newsletter/runtime/discord-sample
      - name: Push sample to Arabic Discord
        run: |
          python - <<'PY'
          import json, os
          from contextlib import ExitStack
          from pathlib import Path
          import requests

          webhook=os.environ.get("DISCORD_WEBHOOK_ARABIC","").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_ARABIC missing")
          paths=[
              Path("arabic_newsletter/runtime/discord-sample/arabic-p1.png"),
              Path("arabic_newsletter/runtime/discord-sample/arabic-p2.png"),
              Path("arabic_newsletter/runtime/discord-sample/arabic-p3.png"),
          ]
          with ExitStack() as stack:
              files={f"files[{i}]":(p.name,stack.enter_context(p.open("rb")),"image/png") for i,p in enumerate(paths)}
              payload={
                  "content":"نموذج تصميم تجريبي للموجز العربي — ليس أخباراً حقيقية",
                  "allowed_mentions":{"parse":[]},
              }
              r=requests.post(webhook,params={"wait":"true"},data={"payload_json":json.dumps(payload,ensure_ascii=False)},files=files,timeout=(10,60))
          r.raise_for_status()
          print("Arabic layout sample delivered; message ID:",r.json().get("id"))
          PY
