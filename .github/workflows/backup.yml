name: State Backup
on:
  schedule:
    - cron: "0 6 * * 0"            # Sunday 10:00 UAE
  workflow_dispatch:
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: data
          key: data-${{ github.run_id }}-backup
          restore-keys: |
            data-
      - name: Upload state database
        uses: actions/upload-artifact@v6
        with:
          name: state-db-backup
          path: data/state.db
          retention-days: 90
          if-no-files-found: error
