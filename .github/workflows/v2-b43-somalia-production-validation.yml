name: AggregateIT V2 B43 actual source validator and translation/dedupe (no post)

on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-b43-somalia-production-validation.yml'

permissions:
  contents: read

concurrency:
  group: aggregateit-v2-b43-somalia-validation
  cancel-in-progress: true

jobs:
  production-validator-no-post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      LLM_API_KEY: ''
      LLM_FALLBACK_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependency-isolated runtime
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Focused B43 actual-validator, production-collector, translation and dedupe tests
        run: python -B -m unittest discover -s tests -p test_v2_b43_somalia_production_validation.py -v
      - name: B43 four-source live production-compatibility and deduplication pass
        run: python -B v2_b43_somalia_production_validation.py --output reports/b43/metadata.json
      - name: Retain sanitized measurements only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-b43-somalia-production-validator-sanitized
          path: reports/b43/metadata.json
          retention-days: 3
          if-no-files-found: warn
