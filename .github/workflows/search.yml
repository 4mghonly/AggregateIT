name: Ticker Search
on:
  workflow_dispatch:
    inputs:
      query:
        description: "Ticker or company name (e.g. nvidia)"
        required: true
        type: string
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests
      - uses: actions/cache@v5
        with:
          path: data
          key: data-${{ github.run_id }}-search
          restore-keys: |
            data-
      - name: Search
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
        run: python tv.py --search "$INPUT_QUERY"
