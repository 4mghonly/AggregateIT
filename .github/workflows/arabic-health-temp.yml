name: Arabic Branch Health Temp
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arabic-health-temp.yml
permissions:
  contents: read
jobs:
  validate-arabic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current Arabic branch
        uses: actions/checkout@v5
        with:
          ref: Arabic
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arabic_newsletter/requirements.txt
      - name: Install Arabic test dependencies
        run: python -m pip install -r arabic_newsletter/requirements.txt
      - name: Compile Arabic code
        run: python -m compileall -q arabic_newsletter arabic_layout
      - name: Run Arabic unit suite
        run: python -m unittest arabic_newsletter.test_arabic -v
