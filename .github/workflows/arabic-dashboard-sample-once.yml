name: One-shot Arabic dashboard sample
on:
  push:
    branches: [Arabic]
    paths:
      - .github/arabic-dashboard-sample-trigger
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_ARABIC: ${{ secrets.DISCORD_WEBHOOK_ARABIC }}
      ARABIC_STATE_DIR: arabic_newsletter/runtime/sample-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          python -m pip install -r arabic_newsletter/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libraqm0
      - name: Render approved dashboard sample and send to Arabic Discord
        run: |
          python - <<'PY'
          from pathlib import Path
          from arabic_newsletter.sample import fixture
          from arabic_newsletter.render import render
          from arabic_newsletter.core import State
          from arabic_newsletter.delivery import send
          brief=fixture(long=False)
          out=Path("arabic_newsletter/runtime/dashboard-sample")
          paths,clipped=render(brief,out)
          state=State(Path("arabic_newsletter/runtime/sample-state"))
          try:
              edition="dashboard-sample-2026-09-19T17-57-33-231Z"
              message_id=send(state,edition,paths)
              print("Arabic dashboard sample delivered; message ID:",message_id)
              print("Clipped blocks:",clipped)
          finally:
              state.close()
          PY
      - name: Upload sample artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabic-dashboard-sample
          path: arabic_newsletter/runtime/dashboard-sample/
          retention-days: 2
