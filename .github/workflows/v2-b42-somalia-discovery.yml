name: AggregateIT V2 B42 Somalia RSS source discovery (no production writes)

on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-b42-somalia-discovery.yml'

permissions:
  contents: read

concurrency:
  group: aggregateit-v2-b42-discovery
  cancel-in-progress: true

jobs:
  bounded-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded source-check dependencies
        run: python -m pip install -r requirements.txt feedparser requests beautifulsoup4
      - name: Focused source validation tests
        run: python -B -m unittest discover -s tests -p test_v2_b42_somalia_feed_probe.py -v
      - name: Single-pass public HTTPS candidate probes
        run: python -B v2_b42_somalia_feed_probe.py --output reports/b42/somalia-candidate-results.json
      - name: Upload sanitized results only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-b42-somalia-source-candidate-metadata
          path: reports/b42/somalia-candidate-results.json
          retention-days: 3
          if-no-files-found: warn
