name: Intelligence Slide Deck
on:
  schedule:
    - cron: "30 11 * * *"        # 15:30 UAE time (GitHub cron uses UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/slide-trigger
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false
jobs:
  slide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests feedparser trafilatura matplotlib
          pip install pillow
      - name: Syntax and layout regression checks
        run: |
          python -m py_compile slide.py gazette_render.py llm.py briefing.py main.py
          python -m unittest -v test_gazette_layout
      - name: Restore data cache
        uses: actions/cache@v5
        with:
          path: data/
          key: data-${{ github.run_id }}-slide
          restore-keys: |
            data-
      - name: Restore reports cache
        uses: actions/cache@v5
        with:
          path: reports/
          key: reports-${{ github.run_id }}-slide
          restore-keys: |
            reports-
      - name: Confirm Gazette Discord route
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EXPECTED_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID || vars.DISCORD_CHANNEL_ID }}
        run: python -c "import slide; slide.discord_webhook_info()"
      - name: Refresh Gazette inputs
        env:
          SOCIAL_PROXY_URL: ${{ secrets.SOCIAL_PROXY_URL }}
          SOCIAL_BUDGET_S: "180"
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL || vars.RSSHUB_BASE_URL }}
          RSS_BRIDGE_URL: ${{ secrets.RSS_BRIDGE_URL || vars.RSS_BRIDGE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python tv.py --pulse || echo "::warning::Market pulse refresh failed; cached data may be used."
          python tv.py --macro || echo "::warning::Macro refresh failed; cached data may be used."
          python -c "import social, time; social.fetch_all(time.time() - 86400)" || echo "::warning::Social refresh failed; cached data may be used."
      - name: Render and deliver Gazette
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_EXPECTED_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID || vars.DISCORD_CHANNEL_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.QWEN_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.QWEN_BASE_URL }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.QWEN_FALLBACK_API_KEY }}
          LLM_FALLBACK_BASE_URL: ${{ vars.LLM_FALLBACK_BASE_URL || secrets.QWEN_FALLBACK_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL }}
          LLM_AUTH_HEADER: ${{ vars.LLM_AUTH_HEADER }}
          LLM_AUTH_SCHEME: ${{ vars.LLM_AUTH_SCHEME }}
          LLM_CHAT_PATH: ${{ vars.LLM_CHAT_PATH }}
          LLM_REQUEST_OPTIONS_JSON: ${{ vars.LLM_REQUEST_OPTIONS_JSON }}
          LLM_EXTRA_HEADERS_JSON: ${{ vars.LLM_EXTRA_HEADERS_JSON }}
          LLM_FALLBACK_AUTH_HEADER: ${{ vars.LLM_FALLBACK_AUTH_HEADER }}
          LLM_FALLBACK_AUTH_SCHEME: ${{ vars.LLM_FALLBACK_AUTH_SCHEME }}
          LLM_FALLBACK_CHAT_PATH: ${{ vars.LLM_FALLBACK_CHAT_PATH }}
          LLM_FALLBACK_REQUEST_OPTIONS_JSON: ${{ vars.LLM_FALLBACK_REQUEST_OPTIONS_JSON }}
          LLM_FALLBACK_EXTRA_HEADERS_JSON: ${{ vars.LLM_FALLBACK_EXTRA_HEADERS_JSON }}
          LLM_MAX_CALLS: "3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python slide.py
      - name: Upload Gazette pages
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregate-gazette
          path: |
            reports/intel_slide_p1.png
            reports/intel_slide_p2.png
          if-no-files-found: warn
      - name: Alert on Gazette failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, requests
          from urllib.parse import urlsplit, urlunsplit
          raw=os.getenv("DISCORD_WEBHOOK","").strip()
          if raw:
              p=urlsplit(raw); url=urlunsplit((p.scheme,p.netloc,p.path,"wait=true",""))
              requests.post(url,json={"content":"⚠️ Aggregate Gazette delivery failed. Run: "+os.getenv("RUN_URL","")},timeout=(10,20))
          PY
