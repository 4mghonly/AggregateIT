name: Intelligence Slide Deck
on:
  schedule:
    - cron: "30 13-19 * * 1-5"
    - cron: "0 20 * * 1-5"
    - cron: "0 0,3,6,9,12,21 * * *"
  workflow_dispatch:
jobs:
  slide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests matplotlib
      - uses: actions/cache@v4
        with:
          path: data
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-
      - name: Fresh snapshots for the deck
        run: python tv.py --pulse --macro
      - name: Render + send deck
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
        run: python slide.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-deck
          path: |
            reports/intel_slide_p1.png
            reports/intel_slide_p2.png
