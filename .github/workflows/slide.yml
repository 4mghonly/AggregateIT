name: Intelligence Slide Deck
on:
  schedule:
    - cron: "30 5 * * *"         # 09:30 GST — mid-morning Gazette, clear of hourly engine and 07:30 briefing
  workflow_dispatch:
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false
jobs:
  slide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests feedparser trafilatura matplotlib
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: data-${{ github.run_id }}-slide
          restore-keys: |
            data-
      - name: Restore reports cache
        uses: actions/cache@v4
        with:
          path: reports/
          key: reports-${{ github.run_id }}-slide
          restore-keys: |
            reports-
      - name: Refresh Gazette inputs
        continue-on-error: true
        env:
          SOCIAL_PROXY_URL: ${{ secrets.SOCIAL_PROXY_URL }}
          SOCIAL_BUDGET_S: "180"
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL || vars.RSSHUB_BASE_URL }}
          RSS_BRIDGE_URL: ${{ secrets.RSS_BRIDGE_URL || vars.RSS_BRIDGE_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: |
          python tv.py --pulse
          python tv.py --macro
          python -c "import social, time; social.fetch_all(time.time() - 86400)"
      - name: Render Gazette
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          QWEN_MAX_CALLS: "3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python slide.py
      - name: Upload Gazette pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-gazette
          path: |
            reports/intel_slide_p1.png
            reports/intel_slide_p2.png
          if-no-files-found: warn
