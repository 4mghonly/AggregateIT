name: AggregateIT V2 B34 isolated acceptance (no post)

on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-isolated-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: aggregateit-v2-b34-isolated-acceptance
  cancel-in-progress: true

jobs:
  offline-and-public-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi
      - name: V2 targeted safety contract
        run: python -B -m unittest discover -s tests -p test_v2_b34_isolated_acceptance.py -v
      - name: Entire isolated V2 suite
        run: python -B -m unittest discover -s tests
      - name: Legacy English suite
        run: python -B tests.py
      - name: Legacy Arabic suite
        run: python -B -m unittest arabic_newsletter.test_arabic
      - name: Read-only original publisher feed and exact-byte parser comparison
        run: python -B v2_b34_isolated_acceptance.py --output reports/v2-b34-live/report.json
      - name: Publish metadata only, never raw RSS bodies
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-b34-publisher-capture-metadata
          path: reports/v2-b34-live/report.json
          retention-days: 3
          if-no-files-found: warn

  isolated-mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated Playwright only
        run: npm install --no-save --package-lock=false playwright@1.64.0
      - name: Install Chromium and runner dependencies
        run: npx playwright install --with-deps chromium
      - name: Eight synthetic viewport checks, no external network
        run: node v2_b32_mobile_browser_qa.mjs > v2-b34-browser-stdout.json
      - name: Collect safe synthetic screenshots and QA receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil
          receipt = Path('v2-b34-browser-stdout.json')
          if receipt.is_file():
              try:
                  result = json.loads(receipt.read_text(encoding='utf8'))
                  src = Path(result['output_dir'])
                  if src.is_dir() and src.name.startswith('aggregateit-b32-'):
                      target = Path('reports/v2-b34-browser')
                      target.mkdir(parents=True, exist_ok=True)
                      for artifact in src.iterdir():
                          if artifact.name in {
                              'qa-report.json', 'english-390.png', 'english-1320.png',
                              'arabic-390.png', 'arabic-1320.png'
                          } and artifact.is_file():
                              shutil.copyfile(artifact, target / artifact.name)
              except (KeyError, ValueError, OSError) as exc:
                  print('QA receipt incomplete:', type(exc).__name__)
          PY
      - name: Publish synthetic-only browser evidence (public repository)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v2-b34-synthetic-chromium-qa
          path: reports/v2-b34-browser/
          retention-days: 3
          if-no-files-found: warn
