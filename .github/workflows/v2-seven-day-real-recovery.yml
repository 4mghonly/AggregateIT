name: V2 seven-day real-archive recovery
on:
  push:
    branches: [audit/b119-evidence-reconciliation]
    paths:
      - '.github/workflows/v2-seven-day-real-recovery.yml'
      - 'v2_recovery_*.py'
      - 'tests/test_v2_recovery_*.py'
  workflow_dispatch:
    inputs:
      arabic_artifact_ids:
        description: "Comma-separated GitHub Actions Arabic artifact IDs"
        required: false
        type: string
      english_artifact_ids:
        description: "Comma-separated GitHub Actions English intel-report artifact IDs"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  historical-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run recovery regression tests
        run: python -m unittest discover -s tests -p 'test_v2_*recovery*.py' -v
      - name: Download immutable source archives from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          AR_IDS: ${{ inputs.arabic_artifact_ids || '13577291060,13588224969,13631864661,13706348417,13799600814,13951542206,14044418018' }}
          EN_IDS: ${{ inputs.english_artifact_ids || '13595225142,13639150027,13719316995,13812311307,13899263741,13993547194,14056072113' }}
        run: |
          python - <<'PY'
          import os,re,urllib.request,pathlib
          root=pathlib.Path('recovery/input')
          for prefix,env in [('ar','AR_IDS'),('en','EN_IDS')]:
              values=os.environ[env].split(',')
              if not 1<=len(values)<=15:raise SystemExit('archive_count_out_of_bounds')
              for value in values:
                  value=value.strip()
                  if not re.fullmatch(r'[0-9]{8,15}',value):raise SystemExit('invalid_artifact_id')
                  url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/artifacts/{value}/zip"
                  req=urllib.request.Request(url,headers={
                      'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                      'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
                  with urllib.request.urlopen(req,timeout=40) as response:
                      data=response.read(10_000_001)
                  if len(data)>10_000_000:raise SystemExit('oversized_artifact')
                  dest=root/prefix;dest.mkdir(parents=True,exist_ok=True)
                  (dest/(value+'.zip')).write_bytes(data)
          PY
      - name: Import seven-day real bilingual evidence
        run: |
          python v2_recovery_arabic_archive.py recovery/input/ar/*.zip --database recovery/history.sqlite --output-dir recovery/output
          python v2_recovery_english_archive.py recovery/input/en/*.zip --database recovery/history.sqlite --output-dir recovery/output
      - name: Retain bilingual previews and SQLite evidence
        uses: actions/upload-artifact@v4
        with:
          name: aggregateit-v2-seven-day-real-history
          path: |
            recovery/output/*.html
            recovery/history.sqlite
          retention-days: 30
          if-no-files-found: error
