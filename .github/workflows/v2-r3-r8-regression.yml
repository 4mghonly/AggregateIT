name: V2 R3-R8 sequential held regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  held-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/b119-evidence-reconciliation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt beautifulsoup4 feedparser pillow reportlab arabic-reshaper python-bidi
      - name: R3 event identity and continuity
        run: python -m unittest discover -s tests -p 'test_v2_b46_delta_identity.py' -v
      - name: R4 markets
        run: python -m unittest discover -s tests -p 'test_v2_b46_market_analytics.py' -v
      - name: R5 editorial diversity
        run: python -m unittest discover -s tests -p 'test_v2_editorial_diversity.py' -v
      - name: R6 native held layout
        run: python -m unittest discover -s tests -p 'test_v2_b46_native_held.py' -v
      - name: R7 weekly history and observation
        run: |
          python -m unittest discover -s tests -p 'test_v2_r7_history_contract.py' -v
          python -m unittest discover -s tests -p 'test_v2_r7_observation_days.py' -v
      - name: R8 editorial and delivery safety
        run: |
          python -m unittest discover -s tests -p 'test_v2_b46_baseline_integrity.py' -v
          python -m unittest discover -s tests -p 'test_v2_b46_live_editorial.py' -v
