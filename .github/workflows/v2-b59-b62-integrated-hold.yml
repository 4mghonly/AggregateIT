name: AggregateIT V2 B59-B65 integrated zero-cost release readiness (NO POST)

on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-b59-b62-integrated-hold.yml'
      - 'v2_b60_original_edition_qa.py'
      - 'tests/test_v2_b63_geometry_evidence.py'
      - 'tests/test_v2_b35_france24_diagnostic.py'
      - 'v2_b64_b65_release_evidence.py'
      - 'tests/test_v2_b64_b65_release_evidence.py'
      - 'docs/v2/B64_B65_AUDIT_RECONCILIATION_SOMALIA_2026-10-28.md'

permissions:
  contents: read

concurrency:
  group: aggregateit-v2-b59-b62-zero-cost
  cancel-in-progress: true

jobs:
  pre-canary-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      LLM_API_KEY: ''
      LLM_FALLBACK_API_KEY: ''
      ARABIC_LLM_API_KEY: ''
      ARABIC_LLM_FALLBACK_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install installed project test dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Focused B59-B65 gates
        run: |
          python -B -m unittest discover -s tests -p test_v2_b59_b62_gate.py -v
          python -B -m unittest discover -s tests -p test_v2_b63_geometry_evidence.py -v
          python -B -m unittest discover -s tests -p test_v2_b64_b65_release_evidence.py -v
      - name: One final V2 and legacy regression
        run: |
          python -B -m unittest discover -s tests
          python -B tests.py
          python -B -m unittest arabic_newsletter.test_arabic
      - name: Execute entire no-post held pre-canary evaluation
        run: python -B v2_b59_b62_runner.py --output reports/b59-b62/status.json
      - name: Retain sanitized test and blocker status only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-b59-b62-precanary-held
          path: reports/b59-b62/status.json
          retention-days: 3
          if-no-files-found: warn
