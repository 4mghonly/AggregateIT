name: Arabic Development Validation

on:
  push:
    branches: [Arabic]
    paths:
      - arabic_newsletter/**
      - arabic_layout/**
      - .github/workflows/arabic-newsletter.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-development-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: Arabic
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: arabic_newsletter/requirements.txt
      - name: Install validation runtime
        run: |
          python -m pip install -r arabic_newsletter/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libraqm0
      - name: Validate Arabic development branch
        env:
          ARABIC_LLM_API_KEY: ""
          ARABIC_LLM_FALLBACK_API_KEY: ""
        run: |
          python -m compileall -q arabic_newsletter arabic_layout
          python -m unittest arabic_newsletter.test_arabic -v
          python -m arabic_newsletter.run --sample --long --output arabic_newsletter/runtime/sample
