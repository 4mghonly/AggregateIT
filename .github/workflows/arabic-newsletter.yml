name: Arabic geopolitical newsletter
on:
  push:
    branches: [Arabic]
    paths:
      - arabic_newsletter/**
      - arabic_layout/**
      - .github/workflows/arabic-newsletter.yml
  workflow_dispatch:
    inputs:
      deliver:
        description: "Deliver a live Arabic briefing to Discord"
        required: false
        type: boolean
        default: false
      preview:
        description: "Render a current-data preview without Discord delivery"
        required: false
        type: boolean
        default: false

# Production 00/06/12/18 UAE timing is owned by the default-branch launcher.
# This branch workflow is intentionally limited to validation, preview and
# explicit manual/live recovery runs so Arabic remains operationally isolated.
permissions:
  contents: read
concurrency:
  # Live/manual delivery never shares a cancellation group with validation pushes.
  group: arabic-newsletter-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.deliver) && 'live' || (github.event_name == 'workflow_dispatch' && inputs.preview) && 'preview' || startsWith(github.event.head_commit.message, 'Arabic live:') && 'live' || startsWith(github.event.head_commit.message, 'Arabic manual-live:') && 'manual' || startsWith(github.event.head_commit.message, 'Arabic preview:') && 'preview' || 'validation' }}
  cancel-in-progress: ${{ !((github.event_name == 'workflow_dispatch' && inputs.deliver) || startsWith(github.event.head_commit.message, 'Arabic live:') || startsWith(github.event.head_commit.message, 'Arabic manual-live:')) }}

jobs:
  arabic:
    if: github.ref == 'refs/heads/Arabic'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ARABIC_STATE_DIR: arabic_newsletter/runtime/state
      ARABIC_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ARABIC_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      ARABIC_LLM_MODEL: ${{ secrets.LLM_MODEL }}
      ARABIC_LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
      ARABIC_LLM_FALLBACK_BASE_URL: ${{ secrets.LLM_FALLBACK_BASE_URL }}
      ARABIC_LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
      ARABIC_LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
      ARABIC_LLM_AUTH_HEADER: ${{ vars.LLM_AUTH_HEADER }}
      ARABIC_LLM_AUTH_SCHEME: ${{ vars.LLM_AUTH_SCHEME }}
      ARABIC_LLM_CHAT_PATH: ${{ vars.LLM_CHAT_PATH }}
      ARABIC_LLM_REQUEST_OPTIONS_JSON: ${{ vars.LLM_REQUEST_OPTIONS_JSON }}
      ARABIC_LLM_EXTRA_HEADERS_JSON: ${{ vars.LLM_EXTRA_HEADERS_JSON }}
      ARABIC_LLM_FALLBACK_AUTH_HEADER: ${{ vars.LLM_FALLBACK_AUTH_HEADER }}
      ARABIC_LLM_FALLBACK_AUTH_SCHEME: ${{ vars.LLM_FALLBACK_AUTH_SCHEME }}
      ARABIC_LLM_FALLBACK_CHAT_PATH: ${{ vars.LLM_FALLBACK_CHAT_PATH }}
      ARABIC_LLM_FALLBACK_REQUEST_OPTIONS_JSON: ${{ vars.LLM_FALLBACK_REQUEST_OPTIONS_JSON }}
      ARABIC_LLM_FALLBACK_EXTRA_HEADERS_JSON: ${{ vars.LLM_FALLBACK_EXTRA_HEADERS_JSON }}
      ARABIC_SOURCES_PER_REGION: "4"
      ARABIC_SOURCE_CONNECT_TIMEOUT_S: "8"
      ARABIC_SOURCE_READ_TIMEOUT_S: "12"
      ARABIC_SYNTH_MAX_CALLS: "5"
      ARABIC_SYNTH_READ_TIMEOUT_S: "60"
      ARABIC_SYNTH_BUDGET_S: "360"
      ARABIC_ANALYSIS_MAX_CALLS: "2"
      ARABIC_ANALYSIS_READ_TIMEOUT_S: "45"
      ARABIC_ANALYSIS_BUDGET_S: "120"
      DISCORD_WEBHOOK_ARABIC: ${{ secrets.DISCORD_WEBHOOK_ARABIC }}
      DISCORD_ARABIC_EXPECTED_CHANNEL_ID: ${{ secrets.DISCORD_ARABIC_CHANNEL_ID || vars.DISCORD_ARABIC_CHANNEL_ID }}
      ARABIC_MAX_UNRESOLVED_REGIONS: ${{ vars.ARABIC_MAX_UNRESOLVED_REGIONS || '5' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Determine run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_DELIVER: ${{ inputs.deliver }}
          DISPATCH_PREVIEW: ${{ inputs.preview }}
        run: |
          python - <<'PY'
          import os
          event=os.getenv("EVENT_NAME","")
          message=os.getenv("HEAD_MESSAGE","")
          live=(event=="push" and message.startswith("Arabic live:")) or os.getenv("DISPATCH_DELIVER","").lower()=="true"
          preview=(event=="push" and message.startswith("Arabic preview:")) or os.getenv("DISPATCH_PREVIEW","").lower()=="true"
          health=(event=="push" and message.startswith("Arabic health:"))
          manual=(event=="push" and message.startswith("Arabic manual-live:"))
          if live or manual:
              preview=False
              health=False
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write(f"live={'true' if live else 'false'}\n")
              fh.write(f"preview={'true' if preview else 'false'}\n")
              fh.write(f"health={'true' if health else 'false'}\n")
              fh.write(f"manual={'true' if manual else 'false'}\n")
          mode="live" if live else ("manual" if manual else ("preview" if preview else ("health" if health else "validation")))
          print("Arabic workflow mode:",mode)
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arabic_newsletter/requirements.txt

      - name: Install isolated dependencies and Arabic fonts
        run: |
          python -m pip install -r arabic_newsletter/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libraqm0

      - name: Confirm approved Arabic production font
        run: |
          test -s /usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf
          test -s /usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf
          echo "Approved font: Noto Sans Arabic"

      - name: Compile and validate Arabic configuration
        run: |
          python -m compileall -q arabic_newsletter arabic_layout
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path("arabic_newsletter/sources.json"),
              Path("arabic_newsletter/glossary.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))
              print("validated", path)
          sources=json.loads(Path("arabic_newsletter/sources.json").read_text(encoding="utf-8"))
          ids=[row["id"] for row in sources]
          assert len(ids)==len(set(ids)), "duplicate Arabic source id"
          required={"id","name","region","country","language","affiliation","website"}
          assert all(required <= set(row) for row in sources), "Arabic source missing required fields"
          feeds=[(row.get("feed") or "").replace("http://","https://").rstrip("/").lower() for row in sources]
          feeds=[url for url in feeds if url]
          assert len(feeds)==len(set(feeds)), "duplicate Arabic feed URL"
          PY

      - name: Check Arabic branch conflict markers and obvious committed secrets
        run: |
          ! grep -RInE '^(<<<<<<<|>>>>>>>)( |$)' --exclude-dir=.git .
          ! grep -RInE 'https://(discord|discordapp)\.com/api(/v[0-9]+)?/webhooks/[0-9]+/[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
          ! grep -RInE '(sk-|qwen-|dashscope-)[A-Za-z0-9_-]{24,}' --exclude-dir=.git .

      - name: Restore Arabic state only
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: arabic_newsletter/runtime/state
          key: arabic-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: arabic-state-v1-

      - name: Test Arabic pipeline
        if: steps.mode.outputs.live != 'true' && steps.mode.outputs.manual != 'true'
        run: python -m unittest arabic_newsletter.test_arabic -v

      - name: Render long Arabic sample
        if: steps.mode.outputs.live != 'true'
        run: python -m arabic_newsletter.run --sample --long --output arabic_newsletter/runtime/sample

      - name: Verify live source health and extraction only
        if: steps.mode.outputs.health == 'true'
        run: python -m arabic_newsletter.run --health-only --output arabic_newsletter/runtime/health

      - name: Validate live Arabic model and Discord route
        if: steps.mode.outputs.live == 'true'
        run: python -m arabic_newsletter.run --preflight --probe-discord

      - name: Validate Arabic model for preview
        if: steps.mode.outputs.preview == 'true'
        run: python -m arabic_newsletter.run --preflight --probe-model

      - name: Audit sources from runner
        if: github.event_name == 'workflow_dispatch' && steps.mode.outputs.live != 'true' && steps.mode.outputs.preview != 'true'
        run: python -m arabic_newsletter.run --audit --output arabic_newsletter/runtime/audit

      - name: Render current-data preview without Discord delivery
        if: steps.mode.outputs.preview == 'true'
        run: |
          END="$(date --iso-8601=seconds)"
          python -m arabic_newsletter.run --end "$END" --output arabic_newsletter/runtime/preview

      - name: Collect, translate, verify, render and deliver live slides
        if: steps.mode.outputs.live == 'true'
        # Manual live pushes are assessment runs ending now. Scheduled production
        # on main still calls --send without --manual-now and keeps fixed 6-hour editions.
        run: python -m arabic_newsletter.run --send --manual-now

      - name: Validate dedicated Discord route for reviewed manual briefing
        if: steps.mode.outputs.manual == 'true'
        run: python -m arabic_newsletter.run --preflight --probe-discord

      - name: Render and deliver reviewed manual Arabic briefing
        if: steps.mode.outputs.manual == 'true'
        run: |
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          src=Path("arabic_newsletter/manual_briefing.b64")
          dst=Path("arabic_newsletter/runtime/manual_briefing.json")
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_bytes(gzip.decompress(base64.b64decode(src.read_text(encoding="ascii").strip())))
          print("reviewed manual briefing materialized",dst)
          PY
          python -m arabic_newsletter.run --manual-file arabic_newsletter/runtime/manual_briefing.json --send

      - name: Alert Arabic channel when a live briefing fails
        if: failure() && (steps.mode.outputs.live == 'true' || steps.mode.outputs.manual == 'true')
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit
          import requests
          raw=os.getenv("DISCORD_WEBHOOK_ARABIC","").strip()
          if raw:
              p=urlsplit(raw)
              url=urlunsplit((p.scheme,p.netloc,p.path,"wait=true",""))
              requests.post(url,json={"content":"⚠️ تعذر إصدار النشرة العربية المجدولة. سجل التشغيل: "+os.getenv("RUN_URL","")},timeout=(10,20))
          PY

      - name: Preserve Arabic delivery ledger even after failures
        if: always()
        uses: actions/cache/save@v5
        with:
          path: arabic_newsletter/runtime/state
          key: arabic-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Arabic samples, sources and run reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arabic-newsletter-${{ github.run_id }}
          path: |
            arabic_newsletter/runtime/output/
            arabic_newsletter/runtime/sample/
            arabic_newsletter/runtime/audit/
            arabic_newsletter/runtime/preview/
            arabic_newsletter/runtime/health/
          retention-days: 7
          if-no-files-found: warn
