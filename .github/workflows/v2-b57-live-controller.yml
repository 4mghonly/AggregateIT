name: AggregateIT V2 B57 actual fallback controller with simulated primary failure NO POST
on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths: ['.github/workflows/v2-b57-live-controller.yml']
permissions:
  contents: read
concurrency:
  group: aggregateit-v2-b57-fallback
  cancel-in-progress: true
jobs:
  bounded-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      OPENROUTER_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Focused production controller and shared 50c budget invariants
        run: python -B -m unittest discover -s tests -p test_v2_b57_real_fallback.py -v
      - name: Complete final V2 and both legacy suites
        run: |
          python -B -m unittest discover -s tests
          python -B tests.py
          python -B -m unittest arabic_newsletter.test_arabic
      - name: Controlled primary failure and real GPT-OSS provider fallback on synthetic text
        run: python -B v2_b57_real_fallback.py --output reports/b57/metadata.json
      - name: Archive only sanitized route, price and acceptance statuses
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-b57-fallback-rehearsal
          path: reports/b57/metadata.json
          retention-days: 3
          if-no-files-found: warn
