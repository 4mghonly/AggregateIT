name: Event-Market Association Diagnostic
on:
  schedule:
    - cron: "0 6 * * 1"         # Monday 10:00 UAE
  workflow_dispatch:
concurrency:
  group: aggregateit-writers
  cancel-in-progress: false
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install requests
      - uses: actions/cache@v5
        with:
          path: data
          key: data-${{ github.run_id }}-calibration
          restore-keys: |
            data-
      - name: Refresh latest market snapshot
        run: python tv.py --pulse || echo "::warning::Pulse refresh failed; diagnostic will use the latest cached snapshot."
      - name: Run event-market association diagnostic
        run: python calibrate.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: event-market-association
          path: reports/calibration_report.json
          if-no-files-found: warn
