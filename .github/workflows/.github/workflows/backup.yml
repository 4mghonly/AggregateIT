name: State Backup
on:
  schedule:
    - cron: "0 6 * * 0"            # Sunday 10:00 GST
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}-backup
          restore-keys: |
            data-
      - name: Upload state.db
        uses: actions/upload-artifact@v4
        with:
          name: state-db-backup
          path: data/state.db
          retention-days: 90
