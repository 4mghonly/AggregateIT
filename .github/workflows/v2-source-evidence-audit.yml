name: V2 independent source evidence (NO POST)
on:
  workflow_dispatch:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths:
      - '.github/workflows/v2-source-evidence-audit.yml'
      - 'audit.py'
      - 'tests/test_v2_source_audit_summary.py'
      - 'tests/test_v2_rss_freshness.py'
      - 'config/sources.json'
permissions:
  contents: read
concurrency:
  group: aggregateit-v2-source-evidence
  cancel-in-progress: false
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      LLM_API_KEY: ''
      LLM_FALLBACK_API_KEY: ''
      ARABIC_LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rebuild/aggregateit-v2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install source audit dependencies
        run: python -m pip install -r requirements.txt feedparser aiohttp
      - name: Verify RSS freshness classification
        run: python -B -m unittest discover -s tests -p test_v2_rss_freshness.py -v
      - name: Audit configured sources without posting
        run: python -B audit.py
      - name: Archive source audit receipt for evidence review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-source-audit
          path: |
            audit_report.json
            audit_summary.json
            audit_freshness_review.json
          retention-days: 7
          if-no-files-found: warn
