name: V2 R2 bilingual model evaluation and Telegram report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      V2_LLM_API_KEY: ${{ secrets.V2_LLM_API_KEY }}
      V2_LLM_BASE_URL: ${{ secrets.V2_LLM_BASE_URL }}
      V2_LLM_MODEL: ${{ secrets.V2_LLM_MODEL }}
      V2_LLM_FALLBACK_API_KEY: ${{ secrets.V2_LLM_FALLBACK_API_KEY }}
      V2_LLM_FALLBACK_BASE_URL: ${{ secrets.V2_LLM_FALLBACK_BASE_URL }}
      V2_LLM_FALLBACK_MODEL: ${{ secrets.V2_LLM_FALLBACK_MODEL }}
      V2_TELEGRAM_BOT_TOKEN: ${{ secrets.V2_TELEGRAM_BOT_TOKEN }}
      V2_TELEGRAM_CHAT_ID_ENGLISH: ${{ secrets.V2_TELEGRAM_CHAT_ID_ENGLISH }}
      V2_TELEGRAM_CHAT_ID_ARABIC: ${{ secrets.V2_TELEGRAM_CHAT_ID_ARABIC }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/b119-evidence-reconciliation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Verify evaluation syntax
        run: python -m py_compile v2_r2_telegram_evaluation.py
      - name: Evaluate two V2 models in both languages and send test-only Telegram report
        run: python v2_r2_telegram_evaluation.py
