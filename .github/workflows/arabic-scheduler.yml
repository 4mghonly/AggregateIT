name: Arabic Briefing Production Scheduler

on:
  schedule:
    # Primary +15m recovery on EVERY day, including Saturday and Sunday.
    # UTC 02/08/14/20 = UAE 06/12/18/00. The :15 wake-up retries only if
    # the corresponding edition is not already recorded as delivered.
    - cron: "0,15 2,8,14,20 * * 0-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/arabic-scheduler.yml
      - .github/arabic-watchdog-trigger

permissions:
  contents: read

concurrency:
  group: arabic-briefing-production
  cancel-in-progress: false

jobs:
  arabic-production:
    # This launcher is ONLY for the Arabic slides. It never runs the main Gazette.
    if: "${{ github.event_name != 'push' || startsWith(github.event.head_commit.message, 'Arabic scheduler') || startsWith(github.event.head_commit.message, 'Arabic watchdog:') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARABIC_STATE_DIR: arabic_newsletter/runtime/state
      ARABIC_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ARABIC_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      ARABIC_LLM_MODEL: ${{ secrets.LLM_MODEL }}
      ARABIC_LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
      ARABIC_LLM_FALLBACK_BASE_URL: ${{ secrets.LLM_FALLBACK_BASE_URL }}
      ARABIC_LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
      ARABIC_LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
      ARABIC_LLM_AUTH_HEADER: ${{ vars.LLM_AUTH_HEADER }}
      ARABIC_LLM_AUTH_SCHEME: ${{ vars.LLM_AUTH_SCHEME }}
      ARABIC_LLM_CHAT_PATH: ${{ vars.LLM_CHAT_PATH }}
      ARABIC_LLM_REQUEST_OPTIONS_JSON: ${{ vars.LLM_REQUEST_OPTIONS_JSON }}
      ARABIC_LLM_EXTRA_HEADERS_JSON: ${{ vars.LLM_EXTRA_HEADERS_JSON }}
      ARABIC_LLM_FALLBACK_AUTH_HEADER: ${{ vars.LLM_FALLBACK_AUTH_HEADER }}
      ARABIC_LLM_FALLBACK_AUTH_SCHEME: ${{ vars.LLM_FALLBACK_AUTH_SCHEME }}
      ARABIC_LLM_FALLBACK_CHAT_PATH: ${{ vars.LLM_FALLBACK_CHAT_PATH }}
      ARABIC_LLM_FALLBACK_REQUEST_OPTIONS_JSON: ${{ vars.LLM_FALLBACK_REQUEST_OPTIONS_JSON }}
      ARABIC_LLM_FALLBACK_EXTRA_HEADERS_JSON: ${{ vars.LLM_FALLBACK_EXTRA_HEADERS_JSON }}
      ARABIC_SOURCES_PER_REGION: "4"
      ARABIC_SOURCE_CONNECT_TIMEOUT_S: "8"
      ARABIC_SOURCE_READ_TIMEOUT_S: "12"
      ARABIC_SYNTH_MAX_CALLS: "5"
      ARABIC_SYNTH_READ_TIMEOUT_S: "60"
      ARABIC_SYNTH_BUDGET_S: "360"
      ARABIC_ANALYSIS_MAX_CALLS: "2"
      ARABIC_ANALYSIS_READ_TIMEOUT_S: "45"
      ARABIC_ANALYSIS_BUDGET_S: "120"
      ARABIC_MAX_UNRESOLVED_REGIONS: ${{ vars.ARABIC_MAX_UNRESOLVED_REGIONS || '5' }}
      DISCORD_WEBHOOK_ARABIC: ${{ secrets.DISCORD_WEBHOOK_ARABIC }}
      DISCORD_ARABIC_EXPECTED_CHANNEL_ID: ${{ secrets.DISCORD_ARABIC_CHANNEL_ID || vars.DISCORD_ARABIC_CHANNEL_ID }}
    steps:
      - name: Check out isolated Arabic engine
        uses: actions/checkout@v5
        with:
          ref: Arabic-production
          persist-credentials: false

      - name: Restore production Arabic state
        uses: actions/cache/restore@v5
        with:
          path: arabic_newsletter/runtime/state
          key: arabic-prod-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: arabic-prod-state-v1-

      - name: Check whether this edition still needs delivery
        id: due
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from arabic_newsletter.core import State, scheduled_window

          state_dir=Path(os.getenv("ARABIC_STATE_DIR","arabic_newsletter/runtime/state"))
          state=State(state_dir)
          try:
              _start,end=scheduled_window(datetime.now(timezone.utc))
              edition=end.isoformat()
              prior=state.delivery(edition)
              needs=not (prior and prior[0]=="sent")
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
                  fh.write(f"edition={edition}\n")
                  fh.write(f"needs_delivery={'true' if needs else 'false'}\n")
              print("Arabic edition:",edition,"needs_delivery=",needs)
          finally:
              state.close()
          PY

      - uses: actions/setup-python@v6
        if: steps.due.outputs.needs_delivery == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: arabic_newsletter/requirements.txt

      - name: Install Arabic runtime
        if: steps.due.outputs.needs_delivery == 'true'
        run: |
          python -m pip install -r arabic_newsletter/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core libraqm0

      - name: Production runtime smoke gate
        if: steps.due.outputs.needs_delivery == 'true'
        run: |
          python -m compileall -q arabic_newsletter arabic_layout
          python - <<'PY'
          from PIL import features
          from arabic_newsletter.core import State, scheduled_window
          from arabic_newsletter.editor import Client
          from arabic_newsletter.delivery import webhook_url
          from arabic_layout.render_engine import Canvas
          assert features.check_feature("raqm"), "Pillow RAQM unavailable"
          Canvas().font(32, False)
          Canvas().font(32, True)
          print("Arabic production smoke gate passed")
          PY
          echo "Production Arabic revision: $(git rev-parse HEAD)"

      - name: Validate model and dedicated Discord route
        if: steps.due.outputs.needs_delivery == 'true'
        run: python -m arabic_newsletter.run --preflight --probe-discord

      - name: Collect, translate, analyze, render and deliver Arabic briefing
        if: steps.due.outputs.needs_delivery == 'true'
        run: python -m arabic_newsletter.run --send

      - name: Confirm recovery wake-up was safely suppressed
        if: steps.due.outputs.needs_delivery == 'false'
        run: echo "Arabic edition ${{ steps.due.outputs.edition }} already delivered; recovery wake-up suppressed."

      - name: Alert Arabic channel on production failure
        if: failure()
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit
          import requests
          raw=os.getenv("DISCORD_WEBHOOK_ARABIC","").strip()
          if raw:
              p=urlsplit(raw)
              url=urlunsplit((p.scheme,p.netloc,p.path,"wait=true",""))
              requests.post(url,json={"content":"⚠️ تعذر إصدار النشرة العربية المجدولة. سجل التشغيل: "+os.getenv("RUN_URL","")},timeout=(10,20))
          PY

      - name: Preserve production Arabic state
        if: always() && steps.due.outputs.needs_delivery == 'true'
        uses: actions/cache/save@v5
        with:
          path: arabic_newsletter/runtime/state
          key: arabic-prod-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Arabic production evidence
        if: always() && steps.due.outputs.needs_delivery == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: arabic-production-${{ github.run_id }}
          path: |
            arabic_newsletter/runtime/output/
          retention-days: 7
          if-no-files-found: warn
