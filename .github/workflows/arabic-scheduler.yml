name: Arabic Briefing V2 Production

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  push:
    branches: [main]
    paths:
      - .github/arabic-v2-trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-v2-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK_ARABIC: ${{ secrets.DISCORD_WEBHOOK_ARABIC }}
      DISCORD_ARABIC_EXPECTED_CHANNEL_ID: ${{ secrets.DISCORD_ARABIC_CHANNEL_ID || vars.DISCORD_ARABIC_CHANNEL_ID }}
      ARABIC_DISCORD_MAX_FILE_BYTES: "19000000"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install minimal V2 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests feedparser beautifulsoup4

      - name: Run Arabic V2 live briefing
        run: python arabic_live_v2.py

      - name: Upload V2 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: arabic-v2-${{ github.run_id }}
          path: arabic_newsletter/runtime/v2/
          retention-days: 7
          if-no-files-found: warn

      - name: Alert on V2 failure
        if: failure()
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          raw=(os.getenv("DISCORD_WEBHOOK_ARABIC") or "").strip()
          if not raw:
              raise SystemExit(0)
          url=raw+("&wait=true" if "?" in raw else "?wait=true")
          body=json.dumps({
            "content":"⚠️ Arabic V2 production failure | "+os.getenv("RUN_URL",""),
            "allowed_mentions":{"parse":[]}
          }).encode("utf-8")
          req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json"},method="POST")
          try:
              urllib.request.urlopen(req,timeout=20).read()
          except Exception:
              pass
          PY
