name: AggregateIT V2 B58 selected model staging and release blockers NO POST
on:
  push:
    branches: ['rebuild/aggregateit-v2']
    paths: ['.github/workflows/v2-b58-release-hold.yml']
permissions:
  contents: read
jobs:
  model-review-and-blockers:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      V2_NO_POST: '1'
      DISCORD_WEBHOOK: ''
      DISCORD_WEBHOOK_ARABIC: ''
      OPENROUTER_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install dependencies without model network
        run: python -m pip install -r requirements.txt pillow pyyaml beautifulsoup4 arabic-reshaper python-bidi langdetect==1.0.9
      - name: Assert production-route hold and five-cent evidence
        run: python -B -m unittest discover -s tests -p test_v2_b58_model_release_gate.py -v
      - name: Final V2 and legacy regression once
        run: |
          python -B -m unittest discover -s tests
          python -B tests.py
          python -B -m unittest arabic_newsletter.test_arabic
      - name: Generate explicit blocked release decision
        run: python -B v2_b58_model_release_gate.py --output reports/b58/blocked.json
      - name: Upload only sanitized release-blocker metadata
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aggregateit-v2-b58-no-release-blockers
          path: reports/b58/blocked.json
          retention-days: 3
          if-no-files-found: warn
